name: Update AMI (push or manual)

on:
  repository_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-ami:
    strategy:
      fail-fast: false
      matrix:
        project: [openfe]
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ matrix.project }}
    outputs:
      ami_id: ${{ steps.packer.outputs.ami_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-builder
          aws-region: ${{ env.AWS_REGION }}

      - name: Set build metadata
        id: metadata
        shell: python
        run: |
          import datetime
          import json
          import os
          from pathlib import Path

          now = datetime.datetime.utcnow()
          today = now.strftime("%Y%m%d")
          full_sha = os.environ["GITHUB_SHA"]
          short_sha = full_sha[:7]
          suffix = f"{today}-{short_sha}"
          try:
              next_year = now.replace(year=now.year + 1)
          except ValueError:
              next_year = now + datetime.timedelta(days=365)
          deletion = next_year.strftime("%Y%m%d")
          tags = json.dumps(
              {
                  "omsf-ami-type": "update",
                  "commit": short_sha,
                  "delete-after": deletion,
              }
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as github_output:
              github_output.write(f"ami_name_suffix={suffix}\n")
              github_output.write(f"additional_tags={tags}\n")

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: latest

      - name: Build AMI
        id: packer
        env:
          AMI_NAME_SUFFIX: ${{ steps.metadata.outputs.ami_name_suffix }}
          ADDITIONAL_TAGS: ${{ steps.metadata.outputs.additional_tags }}
        run: |
          set -euo pipefail
          packer init build-ami.pkr.hcl
          packer build -machine-readable \
            -var-file "${PROJECT}.pkrvars.hcl" \
            -var "ami_name_suffix=${AMI_NAME_SUFFIX}" \
            -var "additional_tags=${ADDITIONAL_TAGS}" \
            build-ami.pkr.hcl | tee packer-output.log
          python - <<'PY'
          import csv
          import os

          ami_id = None
          with open("packer-output.log", newline="", encoding="utf-8") as log_file:
              reader = csv.reader(log_file)
              for row in reader:
                  if len(row) >= 6 and row[2] == "artifact" and row[3] == "0" and row[4] == "id":
                      value = row[5].strip()
                      if not value:
                          continue
                      candidate = value.split(":", 1)[-1].strip()
                      if candidate:
                          ami_id = candidate
                          break

          if not ami_id:
              raise SystemExit("AMI ID not found in packer output")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"ami_id={ami_id}\n")

          print(f"Built AMI: {ami_id}")
          PY
        shell: bash

  test-ami:
    name: Launch and test AMI
    needs: build-ami
    if: ${{ needs.build-ami.outputs.ami_id != '' }}
    runs-on: ubuntu-latest
    env:
      AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
      INSTANCE_TYPE: g5.xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Validate AMI ID output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AMI_ID:-}" ]]; then
            echo "AMI_ID output from build-ami job is empty" >&2
            exit 1
          fi

      - name: Configure AWS credentials for testing
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TEST_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-test
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch test instance
        id: launch
        shell: bash
        env:
          SECURITY_GROUP_ID: ${{ secrets.TEST_MAIN_SECURITY_GROUP_ID }}
          INSTANCE_PROFILE_NAME: ${{ secrets.TEST_MAIN_INSTANCE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${SECURITY_GROUP_ID:-}" ]]; then
            echo "TEST_MAIN_SECURITY_GROUP_ID secret not configured" >&2
            exit 1
          fi
          if [[ -z "${INSTANCE_PROFILE_NAME:-}" ]]; then
            echo "TEST_MAIN_INSTANCE_PROFILE_NAME secret not configured" >&2
            exit 1
          fi
          tmp_output="$(mktemp)"
          cleanup_tmp() {
            rm -f "${tmp_output}"
          }
          trap cleanup_tmp EXIT
          ./test-scripts/launch_instance.sh \
            --ami "${AMI_ID}" \
            --instance-type "${INSTANCE_TYPE}" \
            --security-group "${SECURITY_GROUP_ID}" \
            --iam-profile "${INSTANCE_PROFILE_NAME}" \
            --wait-timeout 1200 \
            --tag "Purpose=ami-test" \
            --tag "Workflow=push.yaml" \
            --tag "Commit=${GITHUB_SHA}" \
            --tag "Run=${GITHUB_RUN_ID}" | tee "${tmp_output}"
          instance_id="$(awk '/\[launch_instance\] InstanceId:/ { id=$NF } END { if (id) print id }' "${tmp_output}")"
          if [[ -z "${instance_id}" || ! "${instance_id}" =~ ^i-[0-9a-f]{17}$ ]]; then
            echo "Failed to capture instance ID from launch_instance.sh output" >&2
            exit 1
          fi
          echo "[test-ami] Launch script reported instance ${instance_id}"
          echo "instance_id=${instance_id}" >> "$GITHUB_OUTPUT"

      - name: Run AMI validation via SSM
        if: ${{ steps.launch.outputs.instance_id != '' }}
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
          LOG_GROUP_NAME: ${{ secrets.TEST_MAIN_LOG_GROUP_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG_GROUP_NAME:-}" ]]; then
            echo "LOG_GROUP_NAME secret not configured" >&2
            exit 1
          fi
          ./test-scripts/run_tests_ssm.sh \
            --instance "${INSTANCE_ID}" \
            --script ./full-tests/openfe.sh \
            --log-group "${LOG_GROUP_NAME}" \
            --comment "AMI validation (${GITHUB_RUN_ID})"

      - name: Terminate test instance
        if: ${{ always() && steps.launch.outputs.instance_id != '' }}
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          set -euo pipefail
          ./test-scripts/cleanup_instance.sh --instance "${INSTANCE_ID}"
