name: Docker Build and Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.collect.outputs.image_repo }}
      image_tag: ${{ steps.collect.outputs.image_tag }}
      environment_matrix: ${{ steps.collect.outputs.environment_matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: latest

      - name: Packer init
        run: packer init build-docker.pkr.hcl

      - name: Build Docker image
        env:
          DOCKER_REPO: ghcr.io/omsf-eco-infra/omsf
        run: |
          set -euo pipefail
          packer build \
            -var-file "openfe.pkrvars.hcl" \
            -var "ami_name_suffix=ci-${{ github.run_id }}-${{ github.sha }}" \
            -var "additional_tags={}" \
            -var "docker_repository=${DOCKER_REPO}" \
            build-docker.pkr.hcl

      - name: Collect packer manifest outputs
        id: collect
        uses: ./.github/actions/collect-packer-metadata
        with:
          manifest_path: packer-docker-manifest.json
          kind: docker
          image_repo: ghcr.io/omsf-eco-infra/omsf

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push "${{ steps.collect.outputs.image_repo }}:${{ steps.collect.outputs.image_tag }}"

  test-environment:
    name: Test environment (${{ matrix.environment.name }})
    needs: build-docker
    if: ${{ needs.build-docker.outputs.image_repo != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.build-docker.outputs.environment_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}"

      - name: Run full tests
        run: |
          set -euo pipefail
          env_name="${{ matrix.environment.name }}"
          docker run --rm \
            -e "MICROMAMBA_DEFAULT_ENVIRONMENT=${env_name}" \
            "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}" \
            bash -lc "/tmp/environments/${env_name}/full-tests.sh"
