name: Docker Build and Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  DOCKER_REPO: ghcr.io/omsf-eco-infra/omsf
  AWS_GHA_RUNNER_HOME_DIR: /home/ubuntu
  AWS_GHA_RUNNER_IMAGE_ID: ${{ vars.AWS_DOCKER_GHA_RUNNER_IMAGE_ID }}
  AWS_GHA_RUNNER_INSTANCE_TYPE: ${{ vars.AWS_DOCKER_GHA_RUNNER_INSTANCE_TYPE }}
  AWS_GHA_RUNNER_ROOT_DEVICE_SIZE: ${{ vars.AWS_DOCKER_GHA_RUNNER_ROOT_DEVICE_SIZE }}

jobs:
  start-aws-runner:
    name: Start AWS self-hosted runner
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
      instances: ${{ steps.aws-start.outputs.instances }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DOCKER_GHA_RUNNER_ASSUME_ROLE_ARN }}
          role-session-name: gha-start-docker-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate runner configuration
        run: |
          set -euo pipefail
          : "${AWS_GHA_RUNNER_IMAGE_ID:?Repository variable AWS_DOCKER_GHA_RUNNER_IMAGE_ID is required}"
          : "${AWS_GHA_RUNNER_INSTANCE_TYPE:?Repository variable AWS_DOCKER_GHA_RUNNER_INSTANCE_TYPE is required}"

      - name: Start runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@v1.0.0
        with:
          aws_home_dir: ${{ env.AWS_GHA_RUNNER_HOME_DIR }}
          aws_image_id: ${{ env.AWS_GHA_RUNNER_IMAGE_ID }}
          aws_instance_type: ${{ env.AWS_GHA_RUNNER_INSTANCE_TYPE }}
          aws_region_name: ${{ env.AWS_REGION }}
          aws_root_device_size: ${{ env.AWS_GHA_RUNNER_ROOT_DEVICE_SIZE }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  build-docker:
    name: Build Docker image
    needs: start-aws-runner
    runs-on: ${{ fromJson(needs.start-aws-runner.outputs.instances) }}
    outputs:
      image_repo: ${{ steps.collect.outputs.image_repo }}
      image_tag: ${{ steps.collect.outputs.image_tag }}
      environment_matrix: ${{ steps.collect.outputs.environment_matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: latest

      - name: Packer init
        run: packer init build-docker.pkr.hcl

      - name: Build Docker image
        env:
          DOCKER_REPO: ${{ env.DOCKER_REPO }}
        run: |
          set -euo pipefail
          packer build \
            -var-file "openfe.pkrvars.hcl" \
            -var "ami_name_suffix=ci-${{ github.run_id }}-${{ github.sha }}" \
            -var "additional_tags={}" \
            -var "docker_repository=${DOCKER_REPO}" \
            build-docker.pkr.hcl

      - name: Collect packer manifest outputs
        id: collect
        uses: ./.github/actions/collect-packer-metadata
        with:
          manifest_path: packer-docker-manifest.json
          kind: docker
          image_repo: ${{ env.DOCKER_REPO }}

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push "${{ steps.collect.outputs.image_repo }}:${{ steps.collect.outputs.image_tag }}"

  stop-aws-runner:
    name: Stop AWS self-hosted runner
    needs: [start-aws-runner, build-docker]
    if: ${{ always() && needs.start-aws-runner.outputs.mapping != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DOCKER_GHA_RUNNER_ASSUME_ROLE_ARN }}
          role-session-name: gha-stop-docker-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop runner
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
          aws_region_name: ${{ env.AWS_REGION }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  test-environment:
    name: Test environment (${{ matrix.environment.name }})
    needs: build-docker
    if: ${{ needs.build-docker.outputs.image_repo != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.build-docker.outputs.environment_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}"

      - name: Run full tests
        run: |
          set -euo pipefail
          env_name="${{ matrix.environment.name }}"
          docker run --rm \
            -e "MICROMAMBA_DEFAULT_ENVIRONMENT=${env_name}" \
            "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}" \
            bash -lc "/tmp/environments/${env_name}/full-tests.sh"
