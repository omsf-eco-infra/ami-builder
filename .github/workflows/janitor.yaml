name: AMI Janitor

on:
  schedule:
    - cron: "0 0 * * 6"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  auto-delete-expired:
    name: Delete expired AMIs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip boto3 click

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLEANUP_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-janitor
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete expired AMIs
        run: python cli/ami_cli.py auto-delete --force
