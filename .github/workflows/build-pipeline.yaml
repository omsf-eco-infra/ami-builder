name: Build Pipeline

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  DEFAULT_INSTANCE_TYPE: g5.xlarge
  DOCKER_REPOSITORY: ghcr.io/omsf-eco-infra/omsf
  AWS_GHA_RUNNER_HOME_DIR: /home/ubuntu
  AWS_GHA_RUNNER_IMAGE_ID: ${{ vars.AWS_DOCKER_GHA_RUNNER_IMAGE_ID }}
  AWS_GHA_RUNNER_ROOT_DEVICE_SIZE: ${{ vars.AWS_DOCKER_GHA_RUNNER_ROOT_DEVICE_SIZE }}

jobs:
  # ── Step 1: Prepare shared build inputs ────────────────────────────
  lock-environments:
    name: Prepare build context
    runs-on: ubuntu-latest
    outputs:
      environment_names: ${{ steps.context.outputs.environment_names }}
      build_kind: ${{ steps.context.outputs.build_kind }}
      ami_name_suffix: ${{ steps.context.outputs.ami_name_suffix }}
      additional_tags: ${{ steps.context.outputs.additional_tags }}
      aws_region: ${{ steps.context.outputs.aws_region }}
      default_instance_type: ${{ steps.context.outputs.default_instance_type }}
      docker_repository: ${{ steps.context.outputs.docker_repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pixi
        run: |
          set -euo pipefail
          PIXI_VERSION="${PIXI_VERSION:-v0.63.0}"
          export PIXI_VERSION
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "${HOME}/.pixi/bin" >> "${GITHUB_PATH}"

      - name: Generate lockfile
        run: |
          set -euo pipefail
          rm -f environments/pixi.lock
          pixi lock --manifest-path environments/pixi.toml

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pixi-lock
          path: environments/pixi.lock
          retention-days: 7

      - name: Compute shared build context
        id: context
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          from pathlib import Path

          toml_path = Path("environments/pixi.toml")
          content = toml_path.read_text(encoding="utf-8")

          # Extract environment names from [environments.NAME] headers.
          pattern = re.compile(r"^\[environments\.([A-Za-z0-9_.-]+)\]", re.MULTILINE)
          env_names = sorted(set(pattern.findall(content)))

          if not env_names:
              raise SystemExit("No environments found in pixi.toml")

          event_name = os.environ["GITHUB_EVENT_NAME"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fp:
              event = json.load(fp)

          now = datetime.datetime.now(datetime.UTC)
          today = now.strftime("%Y%m%d")
          full_sha = os.environ["GITHUB_SHA"]
          short_sha = full_sha[:7]
          suffix = f"{today}-{short_sha}"
          extra_tags = {}
          delete_after_date = now + datetime.timedelta(days=7)

          if event_name == "pull_request":
              build_kind = "pr"
              pr_number = event.get("number")
              head_sha = event.get("pull_request", {}).get("head", {}).get("sha", full_sha)
              short_sha = head_sha[:7]
              suffix = f"pr{pr_number}-{today}-{short_sha}"
              extra_tags["pr"] = str(pr_number) if pr_number is not None else "unknown"
          elif event_name in {"schedule", "workflow_dispatch", "push"}:
              build_kind = {
                  "schedule": "scheduled",
                  "workflow_dispatch": "manual",
                  "push": "push",
              }[event_name]
          else:
              raise SystemExit(f"Unsupported event type for build metadata: {event_name}")

          tags = {
              "omsf-ami-type": build_kind,
              "commit": short_sha,
              "delete-after": delete_after_date.strftime("%Y-%m-%d"),
          }
          tags.update(extra_tags)

          print(f"Discovered environments: {env_names}")
          print(f"Build kind: {build_kind}")
          print(f"Image suffix: {suffix}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"environment_names={json.dumps(env_names)}\n")
              fh.write(f"build_kind={build_kind}\n")
              fh.write(f"ami_name_suffix={suffix}\n")
              fh.write(f"additional_tags={json.dumps(tags)}\n")
              fh.write(f"aws_region={os.environ['AWS_REGION']}\n")
              fh.write(f"default_instance_type={os.environ['DEFAULT_INSTANCE_TYPE']}\n")
              fh.write(f"docker_repository={os.environ['DOCKER_REPOSITORY']}\n")

  # ── Step 2a: Build AMI ─────────────────────────────────────────────
  build-ami:
    name: Build AMI (${{ matrix.project }})
    needs: lock-environments
    strategy:
      fail-fast: false
      matrix:
        project: [openfe]
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ matrix.project }}
    outputs:
      ami_id: ${{ steps.collect.outputs.ami_id }}
      ami_name: ${{ steps.collect.outputs.ami_name }}
      environment_matrix: ${{ steps.collect.outputs.environment_matrix }}
      aws_region: ${{ needs.lock-environments.outputs.aws_region }}
      default_instance_type: ${{ needs.lock-environments.outputs.default_instance_type }}
      recommended_state: ${{ steps.recommend.outputs.state }}
    steps:
      - uses: actions/checkout@v6

      - name: Download lockfile
        uses: actions/download-artifact@v4
        with:
          name: pixi-lock
          path: environments

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip boto3 click

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-builder
          aws-region: ${{ needs.lock-environments.outputs.aws_region }}

      - name: Recommend AMI state
        id: recommend
        shell: bash
        run: |
          set -euo pipefail
          state=$(python cli/ami_cli.py recommend-state)
          echo "state=${state}" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Build AMI
        env:
          AMI_NAME_SUFFIX: ${{ needs.lock-environments.outputs.ami_name_suffix }}
          ADDITIONAL_TAGS: ${{ needs.lock-environments.outputs.additional_tags }}
        run: |
          set -euo pipefail
          packer init build-ami.pkr.hcl
          packer build \
            -var-file "${PROJECT}.pkrvars.hcl" \
            -var "ami_name_suffix=${AMI_NAME_SUFFIX}" \
            -var "additional_tags=${ADDITIONAL_TAGS}" \
            build-ami.pkr.hcl | tee packer-output.log
        shell: bash

      - name: Collect packer manifest outputs
        id: collect
        uses: ./.github/actions/collect-packer-metadata
        with:
          manifest_path: packer-manifest.json
          kind: ami

  # ── Step 2b: Build Docker image ────────────────────────────────────
  build-docker:
    name: Build Docker Image (${{ matrix.project }})
    needs: lock-environments
    strategy:
      fail-fast: false
      matrix:
        project: [openfe]
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ matrix.project }}
    outputs:
      image_repo: ${{ steps.collect.outputs.image_repo }}
      image_tag: ${{ steps.collect.outputs.image_tag }}
      environment_matrix: ${{ steps.collect.outputs.environment_matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Download lockfile
        uses: actions/download-artifact@v4
        with:
          name: pixi-lock
          path: environments

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        env:
          AMI_NAME_SUFFIX: ${{ needs.lock-environments.outputs.ami_name_suffix }}
          ADDITIONAL_TAGS: ${{ needs.lock-environments.outputs.additional_tags }}
          DOCKER_REPO: ${{ needs.lock-environments.outputs.docker_repository }}
        run: |
          set -euo pipefail
          packer init build-docker.pkr.hcl
          packer build \
            -var-file "${PROJECT}.pkrvars.hcl" \
            -var "ami_name_suffix=${AMI_NAME_SUFFIX}" \
            -var "additional_tags=${ADDITIONAL_TAGS}" \
            -var "docker_repository=${DOCKER_REPO}" \
            build-docker.pkr.hcl | tee packer-output.log
        shell: bash

      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push --all-tags "${{ needs.lock-environments.outputs.docker_repository }}"

      - name: Collect packer manifest outputs
        id: collect
        uses: ./.github/actions/collect-packer-metadata
        with:
          manifest_path: packer-docker-manifest.json
          kind: docker
          image_repo: ${{ needs.lock-environments.outputs.docker_repository }}

  # ── Step 3a: Test AMI environments ─────────────────────────────────
  test-ami:
    name: Test AMI (${{ matrix.environment.name }})
    needs: build-ami
    if: ${{ needs.build-ami.outputs.ami_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.build-ami.outputs.environment_matrix) }}
    uses: ./.github/workflows/test-ami-reusable.yml
    with:
      ami_id: ${{ needs.build-ami.outputs.ami_id }}
      ami_name: ${{ needs.build-ami.outputs.ami_name }}
      environment_name: ${{ matrix.environment.name }}
      full_test_script: ${{ matrix.environment.full_script }}
      instance_type: ${{ needs.build-ami.outputs.default_instance_type }}
      region: ${{ needs.build-ami.outputs.aws_region }}
    secrets:
      test_assume_role_arn: ${{ secrets.AWS_TEST_ASSUME_ROLE_ARN }}
      test_security_group_id: ${{ secrets.TEST_SECURITY_GROUP_ID }}
      test_instance_profile_name: ${{ secrets.TEST_INSTANCE_PROFILE_NAME }}
      test_log_group_name: ${{ secrets.TEST_LOG_GROUP_NAME }}

  # ── Step 3b: Start self-hosted GPU runner for Docker tests ─────────
  start-docker-test-runner:
    name: Start Docker test runner
    needs: [lock-environments, build-docker]
    if: ${{ needs.build-docker.outputs.image_repo != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
      instances: ${{ steps.aws-start.outputs.instances }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DOCKER_GHA_RUNNER_ASSUME_ROLE_ARN }}
          role-session-name: gha-start-docker-test-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate runner configuration
        run: |
          set -euo pipefail
          : "${AWS_GHA_RUNNER_IMAGE_ID:?Repository variable AWS_DOCKER_GHA_RUNNER_IMAGE_ID is required}"
          : "${RUNNER_INSTANCE_TYPE:?Runner instance type must be set}"
        env:
          RUNNER_INSTANCE_TYPE: ${{ needs.lock-environments.outputs.default_instance_type }}

      - name: Start runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@v1.0.0
        with:
          aws_home_dir: ${{ env.AWS_GHA_RUNNER_HOME_DIR }}
          aws_image_id: ${{ env.AWS_GHA_RUNNER_IMAGE_ID }}
          aws_instance_type: ${{ needs.lock-environments.outputs.default_instance_type }}
          aws_region_name: ${{ env.AWS_REGION }}
          aws_root_device_size: ${{ env.AWS_GHA_RUNNER_ROOT_DEVICE_SIZE }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  # ── Step 3b: Test Docker environments ──────────────────────────────
  test-docker:
    name: Test Docker (${{ matrix.environment.name }})
    needs: [build-docker, start-docker-test-runner]
    if: ${{ needs.build-docker.outputs.image_repo != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.build-docker.outputs.environment_matrix) }}
    runs-on: ${{ fromJson(needs.start-docker-test-runner.outputs.instances) }}
    steps:
      - name: Ensure runner dependencies (Ubuntu)
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: |
          set -euo pipefail
          docker pull "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}"

      - name: Run full tests
        run: |
          set -euo pipefail
          env_name="${{ matrix.environment.name }}"
          docker run --rm \
            -e "PIXI_DEFAULT_ENVIRONMENT=${env_name}-test" \
            "${{ needs.build-docker.outputs.image_repo }}:${{ needs.build-docker.outputs.image_tag }}" \
            bash -lc "/tmp/environments/${env_name}/full-tests.sh"

  # ── Step 3b: Stop self-hosted GPU runner ───────────────────────────
  stop-docker-test-runner:
    name: Stop Docker test runner
    needs: [start-docker-test-runner, test-docker]
    if: ${{ always() && needs.start-docker-test-runner.outputs.mapping != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DOCKER_GHA_RUNNER_ASSUME_ROLE_ARN }}
          role-session-name: gha-stop-docker-test-runner
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop runner
        uses: omsf/stop-aws-gha-runner@v1.0.0
        with:
          instance_mapping: ${{ needs.start-docker-test-runner.outputs.mapping }}
          aws_region_name: ${{ env.AWS_REGION }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  # ── Step 4: Promote artifacts ──────────────────────────────────────
  promote:
    name: Promote artifacts
    needs: [build-ami, build-docker, test-ami, test-docker]
    if: >-
      ${{ always() &&
          github.event_name != 'pull_request' &&
          needs.build-ami.outputs.ami_id != '' &&
          needs.test-ami.result == 'success' &&
          needs.build-docker.outputs.image_repo != '' &&
          needs.test-docker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── AMI promotion ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip boto3 click

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish or bless AMI
        env:
          AMI_ID: ${{ needs.build-ami.outputs.ami_id }}
          RECOMMENDED_STATE: ${{ needs.build-ami.outputs.recommended_state }}
        run: |
          set -euo pipefail
          case "$RECOMMENDED_STATE" in
            bless|publish)
              python cli/ami_cli.py "$RECOMMENDED_STATE" "$AMI_ID"
              ;;
            *)
              echo "Recommended state is '$RECOMMENDED_STATE'; no publish/bless action."
              ;;
          esac
        shell: bash

      # ── Docker promotion ───────────────────────────────────────────
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote Docker image
        env:
          IMAGE_REPO: ${{ needs.build-docker.outputs.image_repo }}
          IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y%m%d)"

          echo "Pulling build image ${IMAGE_REPO}:${IMAGE_TAG}"
          docker pull "${IMAGE_REPO}:${IMAGE_TAG}"

          echo "Tagging as latest and ${today}"
          docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "${IMAGE_REPO}:latest"
          docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "${IMAGE_REPO}:${today}"

          echo "Pushing promoted tags"
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${today}"
        shell: bash
