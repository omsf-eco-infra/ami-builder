name: AMI Pipeline

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  DEFAULT_INSTANCE_TYPE: g5.xlarge

jobs:
  build-ami:
    name: Build AMI (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [openfe]
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ matrix.project }}
    outputs:
      ami_id: ${{ steps.collect.outputs.ami_id }}
      ami_name: ${{ steps.collect.outputs.ami_name }}
      environment_matrix: ${{ steps.collect.outputs.environment_matrix }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      default_instance_type: ${{ steps.config.outputs.default_instance_type }}
    steps:
      - uses: actions/checkout@v6

      - name: Export shared config
        id: config
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          DEFAULT_INSTANCE_TYPE: ${{ env.DEFAULT_INSTANCE_TYPE }}
        run: |
          {
            echo "aws_region=${AWS_REGION}"
            echo "default_instance_type=${DEFAULT_INSTANCE_TYPE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: gha-ami-builder
          aws-region: ${{ env.AWS_REGION }}

      - name: Set build metadata
        id: metadata
        shell: python
        run: |
          import datetime
          import json
          import os
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fp:
              event = json.load(fp)

          now = datetime.datetime.utcnow()
          today = now.strftime("%Y%m%d")
          full_sha = os.environ["GITHUB_SHA"]
          short_sha = full_sha[:7]
          suffix = f"{today}-{short_sha}"
          extra_tags = {}

          if event_name == "pull_request":
              ami_type = "pr"
              days_to_live = 1
              pr_number = event.get("number")
              head_sha = event.get("pull_request", {}).get("head", {}).get("sha", full_sha)
              short_sha = head_sha[:7]
              suffix = f"pr{pr_number}-{today}-{short_sha}"
              extra_tags["pr"] = str(pr_number) if pr_number is not None else "unknown"
          elif event_name == "schedule":
              ami_type = "scheduled"
              days_to_live = 7
          elif event_name == "workflow_dispatch":
              ami_type = "manual"
              days_to_live = 30
          elif event_name == "push":
              ami_type = "push"
              days_to_live = 30
          else:
              raise SystemExit(f"Unsupported event type for AMI metadata: {event_name}")

          delete_after_date = now + datetime.timedelta(days=days_to_live)

          tags = {
              "omsf-ami-type": ami_type,
              "commit": short_sha,
              "delete-after": delete_after_date.strftime("%Y%m%d"),
              "blessed": false,
          }
          tags.update(extra_tags)
          tags_json = json.dumps(tags)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as github_output:
              github_output.write(f"ami_name_suffix={suffix}\n")
              github_output.write(f"additional_tags={tags_json}\n")

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          packer_version: latest

      - name: Build AMI
        env:
          AMI_NAME_SUFFIX: ${{ steps.metadata.outputs.ami_name_suffix }}
          ADDITIONAL_TAGS: ${{ steps.metadata.outputs.additional_tags }}
        run: |
          set -euo pipefail
          packer init build-ami.pkr.hcl
          packer build \
            -var-file "${PROJECT}.pkrvars.hcl" \
            -var "ami_name_suffix=${AMI_NAME_SUFFIX}" \
            -var "additional_tags=${ADDITIONAL_TAGS}" \
            build-ami.pkr.hcl | tee packer-output.log
        shell: bash

      - name: Collect packer manifest outputs
        id: collect
        run: |
          set -euo pipefail
          manifest_path="packer-manifest.json"
          if [ ! -f "$manifest_path" ]; then
            echo "Packer manifest not found at $manifest_path" >&2
            ls -al
            exit 1
          fi
          ami_id=$(jq -r '.builds[0].artifact_id // empty' "$manifest_path")
          if [ -z "$ami_id" ]; then
            echo "AMI artifact identifier missing from manifest" >&2
            exit 1
          fi
          ami_id=${ami_id##*:}
          ami_name=$(jq -r '.builds[0].custom_data.ami_base_name // ""' "$manifest_path")
          matrix=$(jq -r '.builds[0].custom_data.environment_matrix // ""' "$manifest_path")
          if [ -z "$matrix" ] || [ "$matrix" = "null" ]; then
            echo "Environment matrix missing from manifest" >&2
            exit 1
          fi
          if ! echo "$matrix" | jq -e . >/dev/null; then
            echo "Environment matrix is not valid JSON" >&2
            exit 1
          fi
          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"
          echo "ami_name=$ami_name" >> "$GITHUB_OUTPUT"
          echo "environment_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Collected packer metadata:"
          jq '.builds[0].custom_data' "$manifest_path"

  test-environment:
    name: Test environment (${{ matrix.environment.name }})
    needs: build-ami
    if: ${{ needs.build-ami.outputs.ami_id != '' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.build-ami.outputs.environment_matrix) }}
    uses: ./.github/workflows/test-ami-reusable.yml
    with:
      ami_id: ${{ needs.build-ami.outputs.ami_id }}
      ami_name: ${{ needs.build-ami.outputs.ami_name }}
      environment_name: ${{ matrix.environment.name }}
      full_test_script: ${{ matrix.environment.full_script }}
      instance_type: ${{ needs.build-ami.outputs.default_instance_type }}
      region: ${{ needs.build-ami.outputs.aws_region }}
    secrets:
      test_assume_role_arn: ${{ secrets.AWS_TEST_ASSUME_ROLE_ARN }}
      test_security_group_id: ${{ secrets.TEST_SECURITY_GROUP_ID }}
      test_instance_profile_name: ${{ secrets.TEST_INSTANCE_PROFILE_NAME }}
      test_log_group_name: ${{ secrets.TEST_LOG_GROUP_NAME }}
